apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard17-web
  labels:
    app: taskboard17-web
    app.kubernetes.io/name: taskboard17-web
    app.kubernetes.io/part-of: taskboard17
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard17-web.taskboard17-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard17-web
      port: 80
